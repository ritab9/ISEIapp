<!-- { % include "includes/save_position.html" %} -->



<script>
    const scrollStorageKey = "scrollPosition_" + window.location.pathname;

    // Save current scroll position when leaving the page
    window.addEventListener("beforeunload", function () {
        sessionStorage.setItem(scrollStorageKey, window.scrollY);
    });

    // Restore position after page loads
    window.addEventListener("load", function () {
        const savedPosition = sessionStorage.getItem(scrollStorageKey);

        if (savedPosition !== null) {
            window.scrollTo(0, parseInt(savedPosition, 10));
            sessionStorage.removeItem(scrollStorageKey);
        }
    });

    // Show saved notification
    if (sessionStorage.getItem("showSavedNotification") === "true") {

        sessionStorage.removeItem("showSavedNotification");

        const box = document.getElementById("savedNotification");

        if (box) {
            box.classList.remove("d-none");

            setTimeout(function () {
                box.classList.add("d-none");
            }, 3500);
        }
    }
</script>
